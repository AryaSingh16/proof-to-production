name: obs
services:
  db:
    image: postgres:16-alpine
    command: postgres -c shared_buffers=32MB -c max_connections=20
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-demo-pass
      POSTGRES_DB: tasks
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 160m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d tasks']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    image: ${APP_IMAGE:-task-api:dev}
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://app:app-demo-pass@db:5432/tasks
      ENABLE_FAULT_INJECTION: 'true'
    ports: ['127.0.0.1:8081:8000']
    mem_limit: 128m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'python', '-m', 'app.healthcheck']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=2h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules/rules.yml:ro
    ports: ['127.0.0.1:9090:9090']
    mem_limit: 192m
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9090/-/ready || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
    ports: ['127.0.0.1:3000:3000']
    mem_limit: 192m
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  pgdata:
